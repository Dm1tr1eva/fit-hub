name: Supabase keep-alive

on:
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          body=$(curl -sf https://fit-hub-one-rouge.vercel.app/api/keepalive)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
